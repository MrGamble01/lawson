<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Lawson's Learning Playground</title>

<!-- iOS / iPad "Add to Home Screen" fullscreen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lawson" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#ff4081" />

<link rel="manifest" href="assets/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="apple-touch-icon" href="assets/icon.svg" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated world backdrop (SVG loaded via CSS background-image) -->
  <div id="worldBg" aria-hidden="true"></div>

  <header>
    <h1>Lawson's Playground</h1>
    <button id="muteBtn" class="mute-btn" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button>
  </header>

  <main id="app">
    <!-- Splash / welcome screen -->
    <section id="splash" class="screen active">
      <div class="splash-content">
        <img class="mascot" src="assets/mascot.svg" alt="" aria-hidden="true" draggable="false" />
        <h2 class="splash-title">Lawson's<br>Playground</h2>
        <div class="splash-hint">Tap to play!</div>
      </div>
    </section>

    <!-- Home menu -->
    <section id="menu" class="screen">
      <button class="tile" data-go="letters" style="--c:#ff6b6b">
        <span class="emoji">🔤</span><span class="label">ABC</span>
      </button>
      <button class="tile" data-go="numbers" style="--c:#4dabf7">
        <span class="emoji">🔢</span><span class="label">123</span>
      </button>
      <button class="tile" data-go="colors" style="--c:#ffd43b">
        <span class="emoji">🎨</span><span class="label">Colors</span>
      </button>
      <button class="tile" data-go="shapes" style="--c:#69db7c">
        <span class="emoji">⭐</span><span class="label">Shapes</span>
      </button>
      <button class="tile" data-go="animals" style="--c:#da77f2">
        <span class="emoji">🐶</span><span class="label">Animals</span>
      </button>
      <button class="tile" data-go="pop" style="--c:#ff922b">
        <span class="emoji">🎈</span><span class="label">Pop!</span>
      </button>
      <button class="tile" data-go="match" style="--c:#20c997">
        <span class="emoji">🧩</span><span class="label">Match</span>
      </button>
      <button class="tile" data-go="count" style="--c:#fab005">
        <span class="emoji">🍎</span><span class="label">Count</span>
      </button>
      <button class="tile" data-go="music" style="--c:#845ec2">
        <span class="emoji">🎵</span><span class="label">Music</span>
      </button>
    </section>

    <!-- Generic activity screen (letters/numbers/colors/shapes/animals) -->
    <section id="activity" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="stage" class="stage"></div>
      <div id="bigDisplay" class="big-display"></div>
    </section>

    <!-- Balloon popping -->
    <section id="popGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="popScore" class="badge">🎈 <span id="popScoreVal">0</span></div>
      <div id="popArea" class="pop-area"></div>
    </section>

    <!-- Matching game -->
    <section id="matchGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="matchScore" class="badge">⭐ <span id="matchScoreVal">0</span></div>
      <div class="match-layout">
        <div class="match-target-label" id="matchPrompt">Find this!</div>
        <div id="matchTarget" class="match-target"></div>
        <div id="matchChoices" class="match-choices"></div>
      </div>
    </section>

    <!-- Counting game -->
    <section id="countGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="countScore" class="badge">🏆 <span id="countScoreVal">0</span></div>
      <div class="count-layout">
        <div class="match-target-label" id="countPrompt">Count them!</div>
        <div id="countItems" class="count-items"></div>
      </div>
    </section>

    <!-- Music / xylophone -->
    <section id="musicGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="xylophone" class="xylophone" role="group" aria-label="Xylophone keys">
        <button class="xkey" type="button" style="--c:#ff5252" data-note="C" data-freq="261.63" aria-label="Note C">C</button>
        <button class="xkey" type="button" style="--c:#ff9800" data-note="D" data-freq="293.66" aria-label="Note D">D</button>
        <button class="xkey" type="button" style="--c:#ffc107" data-note="E" data-freq="329.63" aria-label="Note E">E</button>
        <button class="xkey" type="button" style="--c:#4caf50" data-note="F" data-freq="349.23" aria-label="Note F">F</button>
        <button class="xkey" type="button" style="--c:#00bcd4" data-note="G" data-freq="392.00" aria-label="Note G">G</button>
        <button class="xkey" type="button" style="--c:#3f51b5" data-note="A" data-freq="440.00" aria-label="Note A">A</button>
        <button class="xkey" type="button" style="--c:#9c27b0" data-note="B" data-freq="493.88" aria-label="Note B">B</button>
      </div>
    </section>
  </main>

  <!-- Milestone cheer overlay (mascot + banner + confetti) -->
  <div id="cheerOverlay" class="cheer-overlay" aria-hidden="true">
    <div class="cheer-content">
      <img class="mascot mascot-cheer" src="assets/mascot.svg" alt="" aria-hidden="true" draggable="false" />
      <div class="cheer-banner"><span id="cheerText">Great Job!</span></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
