<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Lawson's Learning Playground</title>

<!-- iOS / iPad "Add to Home Screen" fullscreen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lawson" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#ff4081" />

<!-- Inline SVG favicon / home screen icon (no file needed) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff4081'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='64'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Lawson's Playground</h1>
  </header>

  <main id="app">
    <!-- Home menu -->
    <section id="menu" class="screen active">
      <button class="tile" data-go="letters" style="--c:#ff6b6b">
        <span class="emoji">🔤</span><span class="label">ABC</span>
      </button>
      <button class="tile" data-go="numbers" style="--c:#4dabf7">
        <span class="emoji">🔢</span><span class="label">123</span>
      </button>
      <button class="tile" data-go="colors" style="--c:#ffd43b">
        <span class="emoji">🎨</span><span class="label">Colors</span>
      </button>
      <button class="tile" data-go="shapes" style="--c:#69db7c">
        <span class="emoji">⭐</span><span class="label">Shapes</span>
      </button>
      <button class="tile" data-go="animals" style="--c:#da77f2">
        <span class="emoji">🐶</span><span class="label">Animals</span>
      </button>
      <button class="tile" data-go="pop" style="--c:#ff922b">
        <span class="emoji">🎈</span><span class="label">Pop!</span>
      </button>
      <button class="tile" data-go="match" style="--c:#20c997">
        <span class="emoji">🧩</span><span class="label">Match</span>
      </button>
      <button class="tile" data-go="piano" style="--c:#845ef7">
        <span class="emoji">🎹</span><span class="label">Piano</span>
      </button>
      <button class="tile" data-go="whack" style="--c:#f06595">
        <span class="emoji">🐹</span><span class="label">Whack!</span>
      </button>
      <button class="tile" data-go="doodle" style="--c:#22b8cf">
        <span class="emoji">🎨</span><span class="label">Doodle</span>
      </button>
      <button class="tile" data-go="color" style="--c:#fa5252">
        <span class="emoji">🖍️</span><span class="label">Coloring</span>
      </button>
    </section>

    <!-- Generic activity screen (letters/numbers/colors/shapes/animals) -->
    <section id="activity" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="stage" class="stage"></div>
      <div id="bigDisplay" class="big-display"></div>
    </section>

    <!-- Balloon popping -->
    <section id="popGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="popScore" class="badge">🎈 <span id="popScoreVal">0</span></div>
      <div id="popStreak" class="badge badge--streak">🔥 <span id="popStreakVal">0</span></div>
      <div id="popArea" class="pop-area"></div>
    </section>

    <!-- Piano -->
    <section id="pianoGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <button id="pianoSong" class="piano-song-btn">🎵 Song</button>
      <div id="pianoBoard" class="piano-board"></div>
    </section>

    <!-- Whack-a-Mole -->
    <section id="whackGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="whackScore" class="badge">🔨 <span id="whackScoreVal">0</span></div>
      <div id="whackGrid" class="whack-grid"></div>
    </section>

    <!-- Doodle -->
    <section id="doodleGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div class="doodle-tools">
        <button id="doodleStamp" class="doodle-tool">✨ Stamp</button>
        <button id="doodleClear" class="doodle-tool doodle-tool--clear">🧽 Clear</button>
      </div>
      <canvas id="doodleCanvas" class="doodle-canvas"></canvas>
    </section>

    <!-- Coloring Pages -->
    <section id="colorGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div class="color-tools">
        <button id="colorNext" class="color-tool">📄 Next</button>
        <button id="colorClear" class="color-tool color-tool--clear">🧽 Clear</button>
      </div>
      <div id="colorStage" class="color-stage"></div>
      <div id="colorPalette" class="color-palette"></div>
    </section>

    <!-- Matching game -->
    <section id="matchGame" class="screen">
      <button class="home-btn" data-home>🏠</button>
      <div id="matchScore" class="badge">⭐ <span id="matchScoreVal">0</span></div>
      <div class="match-layout">
        <div class="match-target-label" id="matchPrompt">Find this!</div>
        <div id="matchTarget" class="match-target"></div>
        <div id="matchChoices" class="match-choices"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="games/pop.js"></script>
  <script src="games/piano.js"></script>
  <script src="games/whack.js"></script>
  <script src="games/doodle.js"></script>
  <script src="games/color.js"></script>
</body>
</html>
